            \n<format>\nKeyword11 Keyword12 ... \nKeyword21 Keyword22 ...\n・・・ \n\
            KeywordN1 KeywordN2 ... \n</format>\n\n出力例：\n今日 天気 東京 麻布十番\n\n</出力要件>\n"
