    - data:
        code: "import requests\n\n\ndef google_search(query, api_key, cse_id, num=10,\
          \ start=1):\n    \"\"\"\n    Google Custom Search API を利用して検索結果を取得する関数\n\
          \    :param query: 検索キーワード\n    :param api_key: Google API キー\n    :param\
          \ cse_id: カスタム検索エンジン ID\n    :param num: 1回のリクエストで取得する結果数（最大10件）\n    :param\
          \ start: 検索結果の開始位置（1-indexed）\n    :return: API のレスポンス（JSON形式）\n    \"\"\
          \"\n    url = \"https://www.googleapis.com/customsearch/v1\"\n    params\
          \ = {\"q\": query, \"key\": api_key, \"cx\": cse_id, \"num\": num, \"start\"\
          : start}\n\n    response = requests.get(url, params=params)\n    if response.status_code\
          \ == 200:\n        return response.json()\n    else:\n        print(f\"\
          エラー: {response.status_code} {response.text}\")\n        return None\n\n\n\
          def extract_urls(search_results):\n    \"\"\"\n    検索結果から URL リストを抽出する関数\n\
          \    :param search_results: Google Custom Search API のレスポンス（JSON）\n    :return:\
          \ URL のリスト\n    \"\"\"\n    urls = []\n    if search_results and \"items\"\
          \ in search_results:\n        for item in search_results[\"items\"]:\n \
          \           url = item.get(\"link\")\n            if url:\n            \
          \    urls.append(url)\n    return urls\n\n\ndef main(query: str, api_key:\
          \ str, cse_id: str):\n    search_results = google_search(query, api_key,\
          \ cse_id, num=10, start=1)\n    urls = extract_urls(search_results)\n  \
          \  urls = list(set(urls))\n\n    uri = [{\n            \"transfer_method\"\
          : \"remote_url\",\n            \"url\": url,\n            \"type\": \"document\"\
          ,\n    } for url in urls[:3]]\n\n    return {\n        \"uri\": uri,\n \
          \   }\n"
